# Requires SoapyW1700K and matching host controller with band=auto support.
name = "W1700K Auto"
default_band = "2.4g"

[receiver]
# Gain steps, not dB (0–13).
gain = 8.0
# The driver chooses the RF band from each requested frequency.
soapy_args = "driver=w1700k,band=auto,flatten=false"

[sweep]
# 128 MHz usable span covers 2.4 GHz in one hop.
sample_rate_msps = 160.0
usable_bandwidth_ratio = 0.80
overlap_mhz = 5.0
dwell_ms = 3.0
settle_ms = 2.0
fft_size = 4096
# Updated driver discards queued samples after active retunes.
stream_gating = false

[bands.ghz2]
start_mhz = 2400.0
stop_mhz = 2485.0
bin_width_khz = 100.0

[bands.ghz5]
start_mhz = 5150.0
stop_mhz = 5925.0
bin_width_khz = 250.0

[bands.ghz6]
start_mhz = 5925.0
stop_mhz = 7125.0
bin_width_khz = 500.0
