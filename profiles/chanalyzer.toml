# Chanalyzer-like application grid profile based on the provided device parameters.
# These are output/display bin widths, not the raw FFT bin width/RBW.
name = "Chanalyzer-compatible style"
default_band = "2.4g"

[receiver]
gain_db = 40.0
# Optional exact SoapySDR device id to select when present. Usually leave unset for portability.
# device_id = "driver=uhd,type=b200"
# Optional extra SoapySDR args appended to/overriding the selected device args.
# soapy_args = "serial=..., clock_source=external"

[sweep]
sample_rate_msps = 20.0
usable_bandwidth_ratio = 0.80
overlap_mhz = 5.0
dwell_ms = 3.0
settle_ms = 2.0
fft_size = 4096

[display]
show_current = true
show_average = true
show_max_hold = true
show_wifi_overlay = true
show_wifi_labels = true
label_aps_by_bssid = false
wifi_overlay_rssi_floor_dbm = -95.0
wifi_overlay_rssi_ceiling_dbm = -30.0
wifi_overlay_floor_db = -113.0
wifi_overlay_ceiling_db = -30.0

[bands.ghz2]
start_mhz = 2400.0
stop_mhz = 2500.0
# 100 MHz / 256 bins = 390.625 kHz
bin_width_khz = 390.625

[bands.ghz5]
start_mhz = 5145.0
stop_mhz = 5860.0
# 715 MHz / 512 bins = 1396.484375 kHz
bin_width_khz = 1396.484375

[bands.ghz6]
start_mhz = 5925.0
stop_mhz = 7125.0
# 1200 MHz / 672 bins = 1785.714285714 kHz
bin_width_khz = 1785.714285714

[wifi]
hidden_overlay_bssids = []
